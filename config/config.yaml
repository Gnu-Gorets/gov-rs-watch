storage:
  type: sqlite
  path: /data/gatus.db

ui:
  title: Serbia Gov Status
  header: Serbia Gov Status

alerting:
  telegram:
    token: "${TELEGRAM_BOT_TOKEN}"
    id: "${TELEGRAM_CHAT_ID}"
    default-alert:
      enabled: ${TELEGRAM_ALERTS_ENABLED}
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true
      description: "Public service availability check failed."

endpoints:
  - name: eUprava
    group: Core e-government
    url: https://euprava.gov.rs/
    interval: 10m
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 5000"
      - "[CERTIFICATE_EXPIRATION] > 168h"
      - "[BODY] == pat(*eUprava*)"
    alerts:
      - type: telegram

  - name: eID.gov.rs
    group: Identity
    url: https://eid.gov.rs/
    interval: 10m
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 5000"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts:
      - type: telegram

  - name: Welcome to Serbia
    group: Immigration
    url: https://welcometoserbia.gov.rs/
    interval: 10m
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 5000"
      - "[CERTIFICATE_EXPIRATION] > 168h"
      - "[BODY] == pat(*Welcome to Serbia*)"
    alerts:
      - type: telegram

  - name: ePorezi
    group: Taxes
    url: https://eporezi.purs.gov.rs/
    interval: 10m
    maintenance-windows:
      - start: "00:00"
        duration: 6h
        timezone: Europe/Belgrade
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 7000"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts:
      - type: telegram

  - name: APR
    group: Business
    url: https://www.apr.gov.rs/
    interval: 10m
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 5000"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts:
      - type: telegram

  - name: LPA
    group: Taxes
    url: https://lpa.gov.rs/jisportal/homepage
    interval: 10m
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 5000"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts:
      - type: telegram

  - name: eKatastar
    group: Property
    url: https://katastar.rgz.gov.rs/eKatastarPublic/
    interval: 10m
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 5000"
      - "[CERTIFICATE_EXPIRATION] > 168h"
      - "[BODY] == pat(*eKatastarPublic*)"
    alerts:
      - type: telegram

  - name: data.gov.rs
    group: Open data
    url: https://data.gov.rs/
    interval: 10m
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 5000"
      - "[CERTIFICATE_EXPIRATION] > 168h"
      - "[BODY] == pat(*DATA.GOV.RS*)"
    alerts:
      - type: telegram
