storage:
  type: sqlite
  path: /data/gatus.db

ui:
  title: Serbia Gov Status
  header: Serbia Gov Status

endpoints:
  - name: eUprava
    group: Core e-government
    url: https://euprava.gov.rs/
    interval: 10m
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 5000"
      - "[CERTIFICATE_EXPIRATION] > 168h"
      - "[BODY] == pat(*eUprava*)"

  - name: eID.gov.rs
    group: Identity
    url: https://eid.gov.rs/
    interval: 10m
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 5000"
      - "[CERTIFICATE_EXPIRATION] > 168h"

  - name: Welcome to Serbia
    group: Immigration
    url: https://welcometoserbia.gov.rs/
    interval: 10m
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 5000"
      - "[CERTIFICATE_EXPIRATION] > 168h"
      - "[BODY] == pat(*Welcome to Serbia*)"

  - name: ePorezi
    group: Taxes
    url: https://eporezi.purs.gov.rs/
    interval: 10m
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 7000"
      - "[CERTIFICATE_EXPIRATION] > 168h"

  - name: APR
    group: Business
    url: https://www.apr.gov.rs/
    interval: 10m
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 5000"
      - "[CERTIFICATE_EXPIRATION] > 168h"

  - name: LPA
    group: Taxes
    url: https://lpa.gov.rs/jisportal/homepage
    interval: 10m
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 5000"
      - "[CERTIFICATE_EXPIRATION] > 168h"

  - name: eKatastar
    group: Property
    url: https://katastar.rgz.gov.rs/eKatastarPublic/
    interval: 10m
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 5000"
      - "[CERTIFICATE_EXPIRATION] > 168h"
      - "[BODY] == pat(*eKatastarPublic*)"

  - name: data.gov.rs
    group: Open data
    url: https://data.gov.rs/
    interval: 10m
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 5000"
      - "[CERTIFICATE_EXPIRATION] > 168h"
      - "[BODY] == pat(*DATA.GOV.RS*)"
